<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создание домашнего задания</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light text-dark">
    <nav class="navbar navbar-expand bg-white border-bottom shadow-sm">
        <div class="container d-flex flex-wrap gap-3">
            <a class="navbar-brand fw-semibold text-dark mb-0" href="/homeworks">Учебный портал</a>
            <div class="navbar-nav flex-row gap-3">
                <a class="nav-link" href="/homeworks">Домашние задания</a>
                <a class="nav-link" href="/users">Пользователи</a>
            </div>
        </div>
    </nav>
    <main class="container py-4 py-md-5">
    <h1 class="h2 fw-semibold mb-4">Создание домашнего задания</h1>

    <form class="card border-0 shadow-sm p-4 mb-4 col-lg-8" method="POST" action="/admin/homeworks/create">
        <p>
            Предмет:
            <input class="form-control" type="text" name="subject">
        </p>

        <p>
            ID преподавателя:
            <input class="form-control" type="number" name="teacher_id">
        </p>

        <p>
            Дата начала:
            <input class="form-control" type="datetime-local" name="start_date">
        </p>

        <p>
            Дата окончания:
            <input class="form-control" type="datetime-local" name="end_date">
        </p>

        <p>
            Описание:
            <textarea class="form-control" rows="4" name="text"></textarea>
        </p>

        <p>
            Штраф:
            <input class="form-control" type="text" name="penalty">
        </p>

        <button type="submit" class="btn btn-primary">Создать</button>
    </form>

    <p>
        <a href="/admin/homeworks">Назад</a>
    </p>
    </main>
</body>
</html>
