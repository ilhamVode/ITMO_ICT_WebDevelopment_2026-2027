<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создание пользователя</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light text-dark">
    <nav class="navbar navbar-expand bg-white border-bottom shadow-sm">
        <div class="container d-flex flex-wrap gap-3">
            <a class="navbar-brand fw-semibold text-dark mb-0" href="/homeworks">Учебный портал</a>
            <div class="navbar-nav flex-row gap-3">
                <a class="nav-link" href="/homeworks">Домашние задания</a>
                <a class="nav-link" href="/users">Пользователи</a>
            </div>
        </div>
    </nav>
    <main class="container py-4 py-md-5">
    <h1 class="h2 fw-semibold mb-4">Создание пользователя</h1>

    <form class="card border-0 shadow-sm p-4 mb-4 col-lg-8" method="POST" action="/admin/users/create">
        <p>
            Username:
            <input class="form-control" type="text" name="username">
        </p>

        <p>
            Password:
            <input class="form-control" type="password" name="password">
        </p>

        <p>
            Класс:
            <input class="form-control" type="text" name="class_name">
        </p>

        <p>Номер паспорта: <input class="form-control" type="text" name="passport_number"></p>
        <p>Домашний адрес: <input class="form-control" type="text" name="home_address"></p>
        <p>Национальность: <input class="form-control" type="text" name="nationality"></p>

        <p>
            Администратор:
            <input class="form-check-input" type="checkbox" name="is_admin">
        </p>

        <button type="submit" class="btn btn-primary">Создать</button>
    </form>
    </main>
</body>
</html>
